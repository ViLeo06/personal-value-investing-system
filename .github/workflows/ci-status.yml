name: CI Status Tracker

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  issues: write

jobs:
  update-bootstrap-issue:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue_number = 1;
            const run = context.payload.workflow_run;
            const success = run.conclusion === 'success';
            const marker = '<!-- ci-bootstrap-status -->';
            const body = `${marker}\nLatest CI run: ${run.html_url}\nCommit: \`${run.head_sha}\`\nConclusion: **${run.conclusion}**\nUpdated: ${new Date().toISOString()}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: success ? 'closed' : 'open',
              state_reason: success ? 'completed' : 'reopened',
            });
