name: Gate 0 official annual-report evidence

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_cninfo_moutai_2020_report.py'
      - 'requirements-official-evidence.txt'
      - '.github/workflows/gate0-official-evidence.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-official-evidence.txt
      - name: Install pinned parser
        run: python -m pip install --require-hashes=false -r requirements-official-evidence.txt
      - name: Capture official PDF and page-level evidence index
        run: python scripts/fetch_cninfo_moutai_2020_report.py
      - name: Commit evidence or failed-attempt record
        run: |
          if git diff --quiet -- data/raw/gate0/moutai/official/2020-annual-report; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw/gate0/moutai/official/2020-annual-report
          git commit -m 'data: capture Moutai official 2020 annual report [skip ci]'
          git push
