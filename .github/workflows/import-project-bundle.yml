name: Import P0 project bundle

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-project-bundle.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Assemble and verify project bundle
        shell: bash
        run: |
          set -euo pipefail
          for n in 00 01 02 03 04 05 06 07 08; do
            test -f "project_bundle_parts/part-${n}"
          done
          cat project_bundle_parts/part-* | base64 --decode > /tmp/project_bundle.tar.gz
          echo "1ae240b6e5d2a1eb835d41d76b0aa631e31ab16945a8aa89217240994134eed0  /tmp/project_bundle.tar.gz" | sha256sum -c -
      - name: Import non-workflow project files
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/project_bundle.tar.gz -C .
          rm -f .github/workflows/ci.yml
          rm -rf project_bundle_parts
          rm -rf supabase/migration_parts
      - name: Commit P0 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete P0 legacy replay foundation"
          git push
