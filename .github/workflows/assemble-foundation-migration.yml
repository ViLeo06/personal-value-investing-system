name: Assemble foundation migration

on:
  push:
    paths:
      - "supabase/migration_parts/202608300001_foundation.sql.part-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify all parts exist
        shell: bash
        run: |
          set -euo pipefail
          for n in 00 01 02 03 04 05; do
            test -f "supabase/migration_parts/202608300001_foundation.sql.part-${n}"
          done
      - name: Assemble and verify migration
        shell: bash
        run: |
          set -euo pipefail
          cat supabase/migration_parts/202608300001_foundation.sql.part-* > supabase/migrations/202608300001_foundation.sql
          test "$(wc -c < supabase/migrations/202608300001_foundation.sql)" -eq 23040
          echo "a39242c755a4ad7b8da9969428c9c243740ef72219dc5aae782be79dbafd23f3  supabase/migrations/202608300001_foundation.sql" | sha256sum -c -
      - name: Commit canonical migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/migrations/202608300001_foundation.sql; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202608300001_foundation.sql
          git commit -m "db: restore canonical foundation migration"
          git push
